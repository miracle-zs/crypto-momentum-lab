[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "crypto-momentum-lab"
version = "0.1.0"
description = "Short-horizon cryptocurrency momentum research and trading infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=20,<23",
  "PyYAML>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.1,<26",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=16,<17",
  "zstandard>=0.25,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
cml-market-data = "crypto_momentum_lab.apps.market_data.main:app"
cml-execution-account = "crypto_momentum_lab.apps.execution_account.main:app"
cml-research = "crypto_momentum_lab.apps.research.main:app"
cml-research-collector = "crypto_momentum_lab.apps.research_collector.main:app"
cml-strategy-runner = "crypto_momentum_lab.apps.strategy_runner.main:app"
cml-shadow-operation = "crypto_momentum_lab.apps.shadow_operation.main:app"
cml-live-rollout = "crypto_momentum_lab.apps.live_rollout.main:app"
cml-operator-dashboard = "crypto_momentum_lab.apps.operator_dashboard.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_momentum_lab"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires the local PostgreSQL test service",
  "e2e: exercises a full application slice",
  "live: requires public Binance connectivity and a 30-minute runtime",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["crypto_momentum_lab"]

[[tool.mypy.overrides]]
module = ["yaml", "pyarrow", "pyarrow.parquet"]
ignore_missing_imports = true
