services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=32MB
    environment:
      POSTGRES_DB: cml
      POSTGRES_USER: cml
      POSTGRES_PASSWORD: cml
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cml -d cml"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CML_DATABASE_URL: postgresql+asyncpg://cml:cml@postgres:5432/cml

  market-data:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CML_DATABASE_URL: postgresql+asyncpg://cml:cml@postgres:5432/cml
      CML_ENVIRONMENT_CONFIG: configs/environments/research.yaml
    command: ["run-market-data"]
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres-data:
