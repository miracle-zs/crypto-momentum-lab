services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cml
      POSTGRES_USER: cml
      POSTGRES_PASSWORD: cml
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cml -d cml"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
