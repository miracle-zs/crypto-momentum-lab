schema_version: 1

# Desired runtime identity is versioned separately from Compose process
# wiring.  Secrets never belong in this file; deployment values may be
# supplied through the explicit environment references below.
runtime:
  image_commit: "${CML_CODE_COMMIT:?set CML_CODE_COMMIT}"
  migration_revision: "${CML_LIVE_MIGRATION_REVISION:-20260822_0018}"

accounts:
  - label: primary
    strategy: "${CML_LIVE_STRATEGY:-orderflow_impulse}"
    session_id: "${CML_LIVE_SESSION_ID:-live-primary-v1}"
    lease_owner: "${CML_LIVE_LEASE_OWNER:-live-worker}"
    strategy_config_hash: "${CML_LIVE_STRATEGY_CONFIG_HASH:-unset}"
    strategy_config:
      impulse_window_buckets: "${CML_LIVE_IMPULSE_WINDOW_BUCKETS:-4}"
      confirmation_buckets: "${CML_LIVE_CONFIRMATION_BUCKETS:-1}"
      min_return_pct: "${CML_LIVE_MIN_RETURN_PCT:-0.005}"
      min_imbalance: "${CML_LIVE_MIN_IMBALANCE:-0.30}"
      min_intensity: "${CML_LIVE_MIN_INTENSITY:-1.5}"
      min_notional_5m_vs_30m: "${CML_LIVE_MIN_NOTIONAL_5M_VS_30M:-1.50}"
      cooldown_buckets: "${CML_LIVE_COOLDOWN_BUCKETS:-0}"
      entry_positive_gainer_top_count: "${CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT:-10}"
      require_price_above_ema5: false
      require_price_above_ema10: false
      entry_policy_mode: "${CML_LIVE_ENTRY_POLICY_MODE:-enforce}"
      entry_order_type: limit
      entry_limit_ttl_seconds: 900
    profile_ref: compose.server.yaml#services.live-strategy
    limits_ref: postgres:risk_config/primary
    services:
      - execution-account-live
      - live-strategy

  - label: account-2
    strategy: "${CML_LIVE_STRATEGY_ACCOUNT_2:-orderflow_impulse}"
    session_id: "${CML_LIVE_SESSION_ID_ACCOUNT_2:-live-account-2-v1}"
    lease_owner: "${CML_LIVE_LEASE_OWNER_ACCOUNT_2:-live-worker-account-2}"
