      min_notional_5m_vs_30m: "${CML_LIVE_MIN_NOTIONAL_5M_VS_30M_ACCOUNT_2:-1.50}"
      cooldown_buckets: "${CML_LIVE_COOLDOWN_BUCKETS_ACCOUNT_2:-0}"
      entry_positive_gainer_top_count: "${CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT_ACCOUNT_2:-10}"
