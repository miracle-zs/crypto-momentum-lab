name: crypto-momentum-lab

x-app: &app
  build:
    context: .
    args:
      CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  environment: &app-environment
    CML_DATABASE_URL: postgresql+asyncpg://cml:${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}@postgres:5432/cml
    CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  restart: unless-stopped
  stop_grace_period: 60s

x-paper: &paper
  <<: *app
  entrypoint: ["cml-strategy-runner"]
  depends_on:
    market-data:
      condition: service_healthy
  mem_limit: 192m
  healthcheck:
    test:
      - CMD
      - python
      - -m
      - crypto_momentum_lab.apps.healthcheck
      - --service
      - paper
    interval: 30s
    timeout: 15s
    retries: 3
    start_period: 90s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cml
      POSTGRES_USER: cml
      POSTGRES_PASSWORD: ${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cml -d cml"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 384m

  migrate:
    <<: *app
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap-universe:
    <<: *app
    entrypoint: ["cml-market-data"]
    command: ["refresh-universe", "--config", "configs/environments/server_paper.yaml"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  volume-init:
    <<: *app
    user: root
    entrypoint: ["sh", "-c"]
    command: ["chown -R cml:cml /app/data"]
    volumes:
      - market-data:/app/data
    restart: "no"

  market-data:
    <<: *app
    environment:
      <<: *app-environment
      CML_ENVIRONMENT_CONFIG: configs/environments/server_paper.yaml
      CML_PAPER_EXIT_RUN_IDS: >-
        paper-account-01-compression-v1,
        paper-account-02-orderflow-v1,
        paper-account-03-liquidation-v1,
        paper-account-04-compression-candle15m-v1,
        paper-account-05-orderflow-candle15m-v1,
        paper-account-06-liquidation-candle15m-v1
    entrypoint: ["cml-market-data"]
    command: ["run-market-data"]
    depends_on:
      bootstrap-universe:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    volumes:
      - market-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - crypto_momentum_lab.apps.healthcheck
        - --service
        - market-data
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15m
    mem_limit: 640m

  paper-compression-pair:
    <<: *paper
    environment:
      <<: *app-environment
      CML_HEALTHCHECK_RUN_IDS: >-
        paper-account-01-compression-v1,
        paper-account-04-compression-candle15m-v1
    command:
      - paper-live-pair
      - --strategy
      - compression_breakout
      - --environment
      - research
      - --fixed-run-id
      - paper-account-01-compression-v1
      - --candle-run-id
      - paper-account-04-compression-candle15m-v1
      - --signal-interval-seconds
      - "300"
      - --compression-window-buckets
      - "20"
      - --max-range-width-pct
      - "0.025"
      - --min-breakout-pct
      - "0.003"
      - --acceptance-buckets
      - "1"
      - --cooldown-buckets
      - "12"
      - --candidate-notional
      - "25"
      - --paper-initial-balance
      - "1000"
      - --fixed-take-profit-pct
      - "0.03"
      - --fixed-stop-loss-pct
      - "0.015"
      - --fixed-max-holding-buckets
      - "480"
      - --candle-max-holding-buckets
      - "5760"
      - --max-states
      - "100000000"
      - --idle-timeout-seconds
      - "86400"
      - --poll-interval-seconds
      - "1"
      - --batch-size
      - "5000"
      - --checkpoint-every-states
      - "1000"
      - --checkpoint-every-seconds
      - "60"
      - --max-market-state-age-seconds
      - "120"
      - --continue-while-halted
      - --replay-stale-states
      - --require-market-quote
  paper-orderflow-pair:
    <<: *paper
    environment:
      <<: *app-environment
      CML_HEALTHCHECK_RUN_IDS: >-
        paper-account-02-orderflow-v1,
        paper-account-05-orderflow-candle15m-v1
    command:
      - paper-live-pair
      - --strategy
      - orderflow_impulse
      - --environment
      - research
      - --fixed-run-id
      - paper-account-02-orderflow-v1
      - --candle-run-id
      - paper-account-05-orderflow-candle15m-v1
      - --candidate-notional
      - "25"
      - --paper-initial-balance
      - "1000"
      - --fixed-take-profit-pct
      - "0.02"
      - --fixed-stop-loss-pct
      - "0.01"
      - --fixed-max-holding-buckets
      - "80"
      - --candle-max-holding-buckets
      - "5760"
      - --max-states
      - "100000000"
      - --idle-timeout-seconds
      - "86400"
      - --poll-interval-seconds
      - "1"
      - --batch-size
      - "5000"
      - --checkpoint-every-states
      - "1000"
      - --checkpoint-every-seconds
      - "60"
      - --max-market-state-age-seconds
      - "120"
      - --continue-while-halted
      - --replay-stale-states
      - --require-market-quote

  paper-liquidation-pair:
    <<: *paper
    environment:
      <<: *app-environment
      CML_HEALTHCHECK_RUN_IDS: >-
        paper-account-03-liquidation-v1,
        paper-account-06-liquidation-candle15m-v1
    command:
      - paper-live-pair
      - --strategy
      - liquidation_cascade
      - --environment
      - research
      - --fixed-run-id
      - paper-account-03-liquidation-v1
      - --candle-run-id
      - paper-account-06-liquidation-candle15m-v1
      - --candidate-notional
      - "25"
      - --paper-initial-balance
      - "1000"
      - --fixed-take-profit-pct
      - "0.025"
      - --fixed-stop-loss-pct
      - "0.0125"
      - --fixed-max-holding-buckets
      - "60"
      - --candle-max-holding-buckets
      - "5760"
      - --max-states
      - "100000000"
      - --idle-timeout-seconds
      - "86400"
      - --poll-interval-seconds
      - "1"
      - --batch-size
      - "5000"
      - --checkpoint-every-states
      - "1000"
      - --checkpoint-every-seconds
      - "60"
      - --max-market-state-age-seconds
      - "120"
      - --continue-while-halted
      - --replay-stale-states
      - --require-market-quote

  dashboard:
    <<: *app
    environment:
      <<: *app-environment
    entrypoint: ["cml-operator-dashboard"]
    command: ["--host", "0.0.0.0", "--port", "8765"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m

volumes:
  postgres-data:
  market-data:
