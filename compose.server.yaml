name: crypto-momentum-lab

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: crypto-momentum-lab-app:${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  environment: &app-environment
    CML_DATABASE_URL: postgresql+asyncpg://cml:${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}@postgres:5432/cml
    # Optional logical database-plane overrides. Empty values intentionally
    # fall back to CML_DATABASE_URL, so this does not require another disk or
    # another PostgreSQL container on the current cloud host.
    CML_EXECUTION_DATABASE_URL: ${CML_EXECUTION_DATABASE_URL:-}
    CML_MARKET_DATABASE_URL: ${CML_MARKET_DATABASE_URL:-}
    CML_OBSERVABILITY_DATABASE_URL: ${CML_OBSERVABILITY_DATABASE_URL:-}
    CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  restart: unless-stopped
  stop_grace_period: 60s
  logging: *default-logging

x-paper: &paper
  <<: *app
  entrypoint: ["cml-strategy-runner"]
  depends_on:
    market-data:
      condition: service_healthy
  mem_limit: 192m
  healthcheck:
    # This launches a fresh Python interpreter and opens a database
    # connection. Keep the readiness window, but avoid running it every few
    # seconds on a host that also carries the market-data event loop.
    test:
      - CMD
      - python
      - -m
      - crypto_momentum_lab.apps.healthcheck_fast
      - --service
      - paper
    interval: 60s
    timeout: 15s
    retries: 2
    start_period: 90s

services:
  postgres:
    image: postgres:16-alpine
    # Keep observability always-on and bound maintenance concurrency.  The
    # latter prevents a retention/index plan from multiplying work_mem across
    # parallel workers inside the 1 GiB cgroup.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=32MB
    logging: *default-logging
    environment:
      POSTGRES_DB: cml
      POSTGRES_USER: cml
      POSTGRES_PASSWORD: ${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cml -d cml"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    # PostgreSQL is the live control-plane store.  Retention and recovery can
    # briefly use more memory than the steady-state working set.  Keep a
    # bounded 512 MiB swap allowance so the database does not take all host
    # memory while avoiding cgroup OOM during maintenance.
    mem_limit: 1g
    memswap_limit: 1536m
    # PostgreSQL maintenance can use dynamic shared memory for parallel
    # vacuum/index work.  The Docker default is only 64 MiB and previously
    # caused VACUUM (ANALYZE) to fail with ENOSPC despite free disk space.
    shm_size: 256m

  migrate:
    <<: *app
    build:
      context: .
      args:
        CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap-universe:
    <<: *app
    entrypoint: ["cml-market-data"]
    command: ["refresh-universe", "--config", "configs/environments/server_paper.yaml"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  volume-init:
    <<: *app
    user: root
    entrypoint: ["sh", "-c"]
    command: ["chown -R cml:cml /app/data /app/research-data"]
    volumes:
      - market-data:/app/data
      - research-data:/app/research-data
    restart: "no"

  market-data:
    <<: *app
    environment:
      <<: *app-environment
      CML_ENVIRONMENT_CONFIG: configs/environments/server_paper.yaml
      CML_PAPER_EXIT_RUN_IDS: >-
        paper-account-05-orderflow-candle15m-v1,
        paper-account-10-orderflow-b2-long-candle15m-v1,
        paper-account-12-orderflow-b1-long-candle15m-v1,
        paper-account-13-orderflow-b8-long-candle15m-v1,
        paper-account-14-orderflow-b1-gainer100-v1,
        paper-account-15-orderflow-b1-gainer100-ema-v1,
        paper-account-16-orderflow-b8-gainer10-imbalance040-v1,
        paper-account-17-orderflow-b1-gainer10-imbalance040-v1
      # Market-data must protect the same live account used by the live
      # strategy and execution-account services. Fail closed if it is absent.
      CML_LIVE_POSITION_ACCOUNT_LABEL: ${CML_LIVE_ACCOUNT_LABEL:?set CML_LIVE_ACCOUNT_LABEL}
      CML_MARKET_STATE_HUB_HOST: 0.0.0.0
      CML_MARKET_STATE_HUB_PORT: "8766"
    entrypoint: ["cml-market-data"]
    command: ["run-market-data"]
    depends_on:
      bootstrap-universe:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    volumes:
      - market-data:/app/data
    healthcheck:
      # Preserve roughly the previous 2-minute failure-detection window while
      # reducing the Python healthcheck CPU bursts from every 10 seconds.
      test:
        - CMD
        - python
        - -m
        - crypto_momentum_lab.apps.healthcheck_fast
        - --service
        - market-data
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15m
    mem_limit: 640m

  research-collector:
    <<: *app
    entrypoint: ["cml-research-collector"]
    command:
      - run
      - --hub-url
      - ${CML_MARKET_STATE_HUB_URL:-ws://market-data:8766}
      - --environment
      - research
      - --root
      - /app/research-data
      - --account-label
      - ${CML_LIVE_ACCOUNT_LABEL:-primary}
      - --position-environment
      - live
      - --top-count
      - "30"
      - --soft-limit-gib
      - "6"
      - --hard-limit-gib
      - "8"
      - --global-warning-free-gib
      - "15"
      - --global-pause-free-gib
      - "10"
    depends_on:
      market-data:
        condition: service_healthy
    volumes:
      - research-data:/app/research-data
    healthcheck:
      test:
        - CMD
        - cml-research-collector
        - health
        - --root
        - /app/research-data
        - --environment
        - research
        - --max-age-seconds
        - "120"
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 2m
    mem_limit: 192m

  paper-orderflow-pair:
    <<: *paper
    environment:
      <<: *app-environment
      CML_HEALTHCHECK_RUN_IDS: >-
        paper-account-05-orderflow-candle15m-v1,
        paper-account-10-orderflow-b2-long-candle15m-v1,
        paper-account-12-orderflow-b1-long-candle15m-v1,
        paper-account-13-orderflow-b8-long-candle15m-v1
    command:
      - paper-live-pair
      - --strategy
      - orderflow_impulse
      - --environment
      - research
      - --candle-run-id
      - paper-account-05-orderflow-candle15m-v1
      - --fourth-run-id
      - paper-account-10-orderflow-b2-long-candle15m-v1
      - --fourth-entry-long-only
      - --sixth-run-id
      - paper-account-12-orderflow-b1-long-candle15m-v1
      - --sixth-entry-long-only
      - --sixth-candle-grace-bars
      - "1"
      - --sixth-candle-grace-profit-pct
      - "0.0088"
      - --seventh-run-id
      - paper-account-13-orderflow-b8-long-candle15m-v1
      - --seventh-entry-long-only
      - --seventh-candle-grace-bars
      - "8"
      - --seventh-candle-grace-profit-pct
      - "0.0088"
      - --candidate-notional
      - "100"
      - --paper-initial-balance
      - "1000"
      - --fixed-take-profit-pct
      - "0.02"
      - --fixed-stop-loss-pct
      - "0.01"
      - --fixed-max-holding-buckets
      - "80"
      - --candle-max-holding-buckets
      - "5760"
      - --max-states
      - "100000000"
      - --idle-timeout-seconds
      - "86400"
      - --poll-interval-seconds
      - "1.0"
      - --checkpoint-every-states
      - "1000"
      - --checkpoint-every-seconds
      - "60"
      - --max-market-state-age-seconds
      - "120"
      - --require-market-quote
    mem_limit: 256m

  paper-b1-gainer100:
    <<: *paper
    environment:
      <<: *app-environment
      CML_HEALTHCHECK_RUN_ID: paper-account-14-orderflow-b1-gainer100-v1
    volumes:
      - research-data:/app/research-data
    command:
      - paper-live-daemon
      - --strategy
      - orderflow_impulse
      - --environment
      - research
      - --run-id
      - paper-account-14-orderflow-b1-gainer100-v1
      - --entry-long-only
      - --entry-positive-gainer-top-count
      - "100"
      - --no-entry-price-above-ema5
      - --no-entry-price-above-ema10
      - --entry-policy-compare-only
      - --entry-policy-compare-output
      - /app/research-data/entry-policy-observations/paper-account-14-entry-policy.jsonl
      - --orderflow-min-aggressive-imbalance
      - "0.40"
      - --candidate-notional
      - "100"
      - --paper-initial-balance
      - "1000"
      - --exit-mode
      - candle_15m
      - --max-holding-buckets
      - "5760"
      - --candle-grace-bars
      - "1"
      - --candle-grace-profit-pct
      - "0.0088"
      - --max-states
      - "100000000"
      - --idle-timeout-seconds
      - "86400"
      - --poll-interval-seconds
      - "1.0"
      - --checkpoint-every-states
      - "1000"
      - --checkpoint-every-seconds
      - "60"
      - --max-market-state-age-seconds
      - "120"
      - --require-market-quote

  paper-orderflow-gainer10-pair:
    <<: *paper
    environment:
      <<: *app-environment
      CML_HEALTHCHECK_RUN_IDS: >-
        paper-account-16-orderflow-b8-gainer10-imbalance040-v1,
        paper-account-17-orderflow-b1-gainer10-imbalance040-v1
    command:
      - paper-live-pair
      - --strategy
      - orderflow_impulse
      - --environment
      - research
      - --entry-positive-gainer-top-count
      - "10"
      - --orderflow-min-aggressive-imbalance
      - "0.40"
      - --candle-run-id
      - paper-account-16-orderflow-b8-gainer10-imbalance040-v1
      - --candle-entry-long-only
      - --candle-grace-bars
      - "8"
      - --candle-grace-profit-pct
      - "0.0088"
      - --sixth-run-id
      - paper-account-17-orderflow-b1-gainer10-imbalance040-v1
      - --sixth-entry-long-only
      - --sixth-candle-grace-bars
      - "1"
      - --sixth-candle-grace-profit-pct
      - "0.0088"
      - --candidate-notional
      - "100"
      - --paper-initial-balance
      - "1000"
      - --fixed-take-profit-pct
      - "0.02"
      - --fixed-stop-loss-pct
      - "0.01"
      - --fixed-max-holding-buckets
      - "80"
      - --candle-max-holding-buckets
      - "5760"
      - --max-states
      - "100000000"
      - --idle-timeout-seconds
      - "86400"
      - --poll-interval-seconds
      - "1.0"
      - --checkpoint-every-states
      - "1000"
      - --checkpoint-every-seconds
      - "60"
      - --max-market-state-age-seconds
      - "120"
      - --require-market-quote
    mem_limit: 256m

  paper-b1-gainer100-ema:
    <<: *paper
    environment:
      <<: *app-environment
      CML_HEALTHCHECK_RUN_ID: paper-account-15-orderflow-b1-gainer100-ema-v1
    volumes:
      - research-data:/app/research-data
    command:
      - paper-live-daemon
      - --strategy
      - orderflow_impulse
      - --environment
      - research
      - --run-id
      - paper-account-15-orderflow-b1-gainer100-ema-v1
      - --entry-long-only
      - --entry-positive-gainer-top-count
      - "100"
      - --entry-price-above-ema5
      - --entry-price-above-ema10
      - --entry-policy-compare-only
      - --entry-policy-compare-output
      - /app/research-data/entry-policy-observations/paper-account-15-entry-policy.jsonl
      - --candidate-notional
      - "100"
      - --paper-initial-balance
      - "1000"
      - --exit-mode
      - candle_15m
      - --max-holding-buckets
      - "5760"
      - --candle-grace-bars
      - "1"
      - --candle-grace-profit-pct
      - "0.0088"
      - --max-states
      - "100000000"
      - --idle-timeout-seconds
      - "86400"
      - --poll-interval-seconds
      - "1.0"
      - --checkpoint-every-states
      - "1000"
      - --checkpoint-every-seconds
      - "60"
      - --max-market-state-age-seconds
      - "120"
      - --require-market-quote

  execution-account-live:
    <<: *app
    profiles: ["live"]
    environment:
      <<: *app-environment
      BINANCE_READ_API_KEY: ${BINANCE_READ_API_KEY:-}
      BINANCE_READ_API_SECRET: ${BINANCE_READ_API_SECRET:-}
      CML_ACCOUNT_EVENT_HUB_HOST: ${CML_ACCOUNT_EVENT_HUB_HOST:-0.0.0.0}
      CML_ACCOUNT_EVENT_HUB_PORT: ${CML_ACCOUNT_EVENT_HUB_PORT:-8767}
    entrypoint: ["cml-execution-account"]
    command:
      - sync
      - --environment
      - live
      - --account-label
      - ${CML_LIVE_ACCOUNT_LABEL:-primary}
      - --hedge-mode
      - --interval-seconds
      - "15"
      - --fill-interval-seconds
      - "300"
      - --rest-reconciliation-interval-seconds
      - "300"
      - --snapshot-retention-days
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_DAYS:-7}
      - --equity-retention-days
      - ${CML_ACCOUNT_EQUITY_RETENTION_DAYS:-370}
      - --snapshot-retention-interval-seconds
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_INTERVAL_SECONDS:-3600}
      - --snapshot-retention-batch-size
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_BATCH_SIZE:-250}
      - --snapshot-retention-max-rows-per-table
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_MAX_ROWS_PER_TABLE:-5000}
      - --snapshot-retention-max-runtime-seconds
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_MAX_RUNTIME_SECONDS:-45}
      - --account-event-hub-host
      - ${CML_ACCOUNT_EVENT_HUB_HOST:-0.0.0.0}
      - --account-event-hub-port
      - ${CML_ACCOUNT_EVENT_HUB_PORT:-8767}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - crypto_momentum_lab.apps.healthcheck_fast
        - --service
        - execution-account
        # Live account readiness is process state only; live execution does
        # not apply a hidden account-data age cutoff.
        - --ignore-age
        - --account-label
        - ${CML_LIVE_ACCOUNT_LABEL:-primary}
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    mem_limit: 160m
    memswap_limit: 320m

  live-strategy:
    <<: *app
    profiles: ["live"]
    environment:
      <<: *app-environment
      BINANCE_TRADE_API_KEY: ${BINANCE_TRADE_API_KEY:-}
      BINANCE_TRADE_API_SECRET: ${BINANCE_TRADE_API_SECRET:-}
      CML_HEALTHCHECK_RUN_ID: ${CML_LIVE_SESSION_ID:-live-primary-v1}
      CML_MARKET_STATE_HUB_URL: ${CML_MARKET_STATE_HUB_URL:-ws://market-data:8766}
      CML_MARKET_QUOTE_HUB_URL: ${CML_MARKET_QUOTE_HUB_URL:-ws://market-data:8768}
      CML_ACCOUNT_EVENT_HUB_URL: ${CML_ACCOUNT_EVENT_HUB_URL:-ws://execution-account-live:8767}
    entrypoint: ["cml-live-rollout"]
    command:
      - run
      - --account-label
      - ${CML_LIVE_ACCOUNT_LABEL:-primary}
      - --strategy
      - ${CML_LIVE_STRATEGY:-orderflow_impulse}
      - --market-environment
      - research
      - --market-state-source
      - hub
      - --market-state-hub-url
      - ${CML_MARKET_STATE_HUB_URL:-ws://market-data:8766}
      - --market-quote-hub-url
      - ${CML_MARKET_QUOTE_HUB_URL:-ws://market-data:8768}
      - --account-event-hub-url
      - ${CML_ACCOUNT_EVENT_HUB_URL:-ws://execution-account-live:8767}
      - --session-id
      - ${CML_LIVE_SESSION_ID:-live-primary-v1}
      - --operator
      - ${CML_LIVE_OPERATOR:-operator}
      - --lease-owner
      - ${CML_LIVE_LEASE_OWNER:-live-worker}
      - --strategy-config-hash
      - ${CML_LIVE_STRATEGY_CONFIG_HASH:-unset}
      - --git-commit-hash
      - ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
      - --migration-revision
      - ${CML_LIVE_MIGRATION_REVISION:-20260822_0018}
      - --max-runtime-seconds
      - "31536000"
      - --poll-interval-seconds
      - "0.25"
      - --checkpoint-every-states
      - "100"
      - --hedge-mode
      - --entry-long-only
      - --entry-positive-gainer-top-count
      - ${CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT:-10}
      - --no-entry-price-above-ema5
      - --no-entry-price-above-ema10
      - --entry-leverage
      - ${CML_LIVE_ENTRY_LEVERAGE:-5}
      # Production rollout explicitly retains only auditable write boundaries.
      - --persist-exchange-operations
      - ${CML_LIVE_PERSIST_EXCHANGE_OPERATIONS:-}
      - --exit-mode
      - ${CML_LIVE_EXIT_MODE:-candle_15m}
      - --take-profit-pct
      - ${CML_LIVE_TAKE_PROFIT_PCT:-0.02}
      - --stop-loss-pct
      - ${CML_LIVE_STOP_LOSS_PCT:-0.01}
      - --candle-grace-bars
      - ${CML_LIVE_CANDLE_GRACE_BARS:-8}
      - --candle-grace-decision-profit-pct
      - ${CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT:-0.001}
      - --candle-grace-profit-pct
      - ${CML_LIVE_CANDLE_GRACE_PROFIT_PCT:-0.0088}
      - --i-understand-this-places-real-orders
    depends_on:
      market-data:
        # Live starts with the feed process; no hidden freshness gate.
        condition: service_started
      execution-account-live:
        condition: service_healthy
    healthcheck:
      # The endpoint is inexpensive once running, but starting Python for
      # every probe still competes with the data and strategy processes.
      test:
        - CMD
        - python
        - -m
        - crypto_momentum_lab.apps.healthcheck_fast
        - --service
        - live
        - --account-label
        - ${CML_LIVE_ACCOUNT_LABEL:-primary}
        - --session-id
        - ${CML_LIVE_SESSION_ID:-live-primary-v1}
        - --lease-owner
        - ${CML_LIVE_LEASE_OWNER:-live-worker}
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 2m
    # Observed usage is below 200 MiB; 1 GiB was over-provisioned on this host.
    mem_limit: 512m
    memswap_limit: 768m

  dashboard:
    <<: *app
    # Keep dashboard-only copy changes from forcing a live approval/code hash
    # rotation. The default remains the single release image.
    image: ${CML_DASHBOARD_IMAGE:-crypto-momentum-lab-app:${CML_CODE_COMMIT:?set CML_CODE_COMMIT}}
    environment:
      <<: *app-environment
      CML_PAPER_ACCOUNT_RUN_IDS: >-
        paper-account-05-orderflow-candle15m-v1,
        paper-account-10-orderflow-b2-long-candle15m-v1,
        paper-account-12-orderflow-b1-long-candle15m-v1,
        paper-account-13-orderflow-b8-long-candle15m-v1,
        paper-account-14-orderflow-b1-gainer100-v1,
        paper-account-15-orderflow-b1-gainer100-ema-v1,
        paper-account-16-orderflow-b8-gainer10-imbalance040-v1,
        paper-account-17-orderflow-b1-gainer10-imbalance040-v1
      CML_DASHBOARD_LIVE_CASH_FLOWS_JSON: ${CML_DASHBOARD_LIVE_CASH_FLOWS_JSON:-}
      CML_DASHBOARD_COMMON_EQUITY_START_AT: "2026-08-21T02:45:00Z"
    entrypoint: ["cml-operator-dashboard"]
    command: ["--host", "0.0.0.0", "--port", "8765"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 4
    # The dashboard process regularly uses over 200 MiB with all sections
    # loaded, so keep headroom without reserving the old live-strategy budget.
    mem_limit: 320m
    memswap_limit: 512m

volumes:
  postgres-data:
  market-data:
  research-data:
