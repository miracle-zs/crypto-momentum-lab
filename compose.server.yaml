name: crypto-momentum-lab

x-app: &app
  build:
    context: .
    args:
      CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  environment: &app-environment
    CML_DATABASE_URL: postgresql+asyncpg://cml:${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}@postgres:5432/cml
    CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  restart: unless-stopped
  stop_grace_period: 60s

x-paper: &paper
  <<: *app
  entrypoint: ["cml-strategy-runner"]
  depends_on:
    market-data:
      condition: service_healthy
  mem_limit: 192m
  healthcheck:
    test:
      - CMD
      - python
      - -m
      - crypto_momentum_lab.apps.healthcheck
      - --service
      - paper
    interval: 30s
    timeout: 15s
    retries: 3
    start_period: 90s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cml
      POSTGRES_USER: cml
      POSTGRES_PASSWORD: ${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cml -d cml"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 384m

  migrate:
    <<: *app
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap-universe:
    <<: *app
    entrypoint: ["cml-market-data"]
    command: ["refresh-universe", "--config", "configs/environments/server_paper.yaml"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  volume-init:
    <<: *app
    user: root
    entrypoint: ["sh", "-c"]
    command: ["chown -R cml:cml /app/data"]
    volumes:
      - market-data:/app/data
    restart: "no"

  market-data:
    <<: *app
    environment:
      <<: *app-environment
      CML_ENVIRONMENT_CONFIG: configs/environments/server_paper.yaml
      CML_PAPER_EXIT_RUN_IDS: >-
        paper-account-02-orderflow-v1,
        paper-account-05-orderflow-candle15m-v1,
        paper-account-10-orderflow-b2-long-candle15m-v1,
        paper-account-12-orderflow-b1-long-candle15m-v1,
        paper-account-13-orderflow-b8-long-candle15m-v1
      CML_LIVE_POSITION_ACCOUNT_LABEL: ${CML_LIVE_ACCOUNT_LABEL:-}
    entrypoint: ["cml-market-data"]
    command: ["run-market-data"]
    depends_on:
      bootstrap-universe:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    volumes:
      - market-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - crypto_momentum_lab.apps.healthcheck
        - --service
        - market-data
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15m
    mem_limit: 640m

  paper-orderflow-pair:
    <<: *paper
    environment:
      <<: *app-environment
      CML_HEALTHCHECK_RUN_IDS: >-
        paper-account-02-orderflow-v1,
        paper-account-05-orderflow-candle15m-v1,
        paper-account-10-orderflow-b2-long-candle15m-v1,
        paper-account-12-orderflow-b1-long-candle15m-v1,
        paper-account-13-orderflow-b8-long-candle15m-v1
    command:
      - paper-live-pair
      - --strategy
      - orderflow_impulse
      - --environment
      - research
      - --fixed-run-id
      - paper-account-02-orderflow-v1
      - --candle-run-id
      - paper-account-05-orderflow-candle15m-v1
      - --fourth-run-id
      - paper-account-10-orderflow-b2-long-candle15m-v1
      - --fourth-entry-long-only
      - --sixth-run-id
      - paper-account-12-orderflow-b1-long-candle15m-v1
      - --sixth-entry-long-only
      - --sixth-candle-grace-bars
      - "1"
      - --sixth-candle-grace-profit-pct
      - "0.0088"
      - --seventh-run-id
      - paper-account-13-orderflow-b8-long-candle15m-v1
      - --seventh-entry-long-only
      - --seventh-candle-grace-bars
      - "8"
      - --seventh-candle-grace-profit-pct
      - "0.0088"
      - --candidate-notional
      - "100"
      - --paper-initial-balance
      - "1000"
      - --fixed-take-profit-pct
      - "0.02"
      - --fixed-stop-loss-pct
      - "0.01"
      - --fixed-max-holding-buckets
      - "80"
      - --candle-max-holding-buckets
      - "5760"
      - --max-states
      - "100000000"
      - --idle-timeout-seconds
      - "86400"
      - --poll-interval-seconds
      - "1"
      - --checkpoint-every-states
      - "1000"
      - --checkpoint-every-seconds
      - "60"
      - --max-market-state-age-seconds
      - "120"
      - --require-market-quote
    mem_limit: 256m

  execution-account-live:
    <<: *app
    profiles: ["live"]
    environment:
      <<: *app-environment
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
    entrypoint: ["cml-execution-account"]
    command:
      - sync
      - --environment
      - live
      - --account-label
      - ${CML_LIVE_ACCOUNT_LABEL:-primary}
      - --hedge-mode
      - --interval-seconds
      - "5"
      - --fill-interval-seconds
      - "60"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - crypto_momentum_lab.apps.healthcheck
        - --service
        - execution-account
        - --account-label
        - ${CML_LIVE_ACCOUNT_LABEL:-primary}
        - --max-age-seconds
        - "30"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 128m

  live-strategy:
    <<: *app
    profiles: ["live"]
    environment:
      <<: *app-environment
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      CML_HEALTHCHECK_RUN_ID: ${CML_LIVE_SESSION_ID:-live-primary-v1}
    entrypoint: ["cml-live-rollout"]
    command:
      - run
      - --account-label
      - ${CML_LIVE_ACCOUNT_LABEL:-primary}
      - --strategy
      - ${CML_LIVE_STRATEGY:-orderflow_impulse}
      - --market-environment
      - research
      - --session-id
      - ${CML_LIVE_SESSION_ID:-live-primary-v1}
      - --operator
      - ${CML_LIVE_OPERATOR:-operator}
      - --lease-owner
      - ${CML_LIVE_LEASE_OWNER:-live-worker}
      - --strategy-config-hash
      - ${CML_LIVE_STRATEGY_CONFIG_HASH:-unset}
      - --git-commit-hash
      - ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
      - --migration-revision
      - ${CML_LIVE_MIGRATION_REVISION:-20260814_0015}
      - --max-runtime-seconds
      - "31536000"
      - --poll-interval-seconds
      - "1"
      - --state-stale-after-seconds
      - "30"
      - --checkpoint-every-states
      - "100"
      - --hedge-mode
      - --entry-long-only
      - --entry-leverage
      - ${CML_LIVE_ENTRY_LEVERAGE:-1}
      - --exit-mode
      - ${CML_LIVE_EXIT_MODE:-candle_15m}
      - --take-profit-pct
      - ${CML_LIVE_TAKE_PROFIT_PCT:-0.02}
      - --stop-loss-pct
      - ${CML_LIVE_STOP_LOSS_PCT:-0.01}
      - --candle-grace-bars
      - ${CML_LIVE_CANDLE_GRACE_BARS:-1}
      - --candle-grace-profit-pct
      - ${CML_LIVE_CANDLE_GRACE_PROFIT_PCT:-0.0088}
      - --max-holding-seconds
      - ${CML_LIVE_MAX_HOLDING_SECONDS:-86400}
      - --i-understand-this-places-real-orders
    depends_on:
      market-data:
        condition: service_healthy
      execution-account-live:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - crypto_momentum_lab.apps.healthcheck
        - --service
        - paper
        - --max-age-seconds
        - "180"
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 2m
    mem_limit: 1g

  dashboard:
    <<: *app
    environment:
      <<: *app-environment
      CML_PAPER_ACCOUNT_RUN_IDS: >-
        paper-account-02-orderflow-v1,
        paper-account-05-orderflow-candle15m-v1,
        paper-account-10-orderflow-b2-long-candle15m-v1,
        paper-account-12-orderflow-b1-long-candle15m-v1,
        paper-account-13-orderflow-b8-long-candle15m-v1
    entrypoint: ["cml-operator-dashboard"]
    command: ["--host", "0.0.0.0", "--port", "8765"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m

volumes:
  postgres-data:
  market-data:
