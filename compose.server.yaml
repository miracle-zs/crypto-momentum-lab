name: crypto-momentum-lab

x-default-logging: &default-logging
  driver: json-file
  options:
    # Keep enough history to diagnose a crash even when the monitor is
    # restarting the container.  The monitor also copies the stream to the
    # persistent crash-log directory before recovery.
    max-size: "20m"
    max-file: "10"

x-app: &app
  image: crypto-momentum-lab-app:${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  environment: &app-environment
    CML_DATABASE_URL: postgresql+asyncpg://cml:${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}@postgres:5432/cml
    # Optional logical database-plane overrides. Empty values intentionally
    # fall back to CML_DATABASE_URL, so this does not require another disk or
    # another PostgreSQL container on the current cloud host.
    CML_EXECUTION_DATABASE_URL: ${CML_EXECUTION_DATABASE_URL:-}
    CML_MARKET_DATABASE_URL: ${CML_MARKET_DATABASE_URL:-}
    CML_OBSERVABILITY_DATABASE_URL: ${CML_OBSERVABILITY_DATABASE_URL:-}
    CML_LOCAL_HEALTH_DIR: /run/cml/health
    CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
    CML_DB_EXECUTION_POOL_SIZE: 4
    CML_DB_EXECUTION_MAX_OVERFLOW: 0
    CML_DB_EXECUTION_POOL_TIMEOUT_SECONDS: 10.0
    CML_DB_EXECUTION_COMMAND_TIMEOUT_SECONDS: 10.0
    CML_DB_OBSERVABILITY_POOL_SIZE: 1
    CML_DB_OBSERVABILITY_MAX_OVERFLOW: 0
    CML_DB_OBSERVABILITY_POOL_TIMEOUT_SECONDS: 10.0
    CML_DB_OBSERVABILITY_COMMAND_TIMEOUT_SECONDS: 10.0
    # Opt-in memory attribution for a controlled diagnostic restart.
    CML_TRACEMALLOC: ${CML_TRACEMALLOC:-0}
    CML_TRACEMALLOC_FRAMES: ${CML_TRACEMALLOC_FRAMES:-1}
    MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
  restart: unless-stopped
  # Short-lived/stateless services can restart quickly. Services that flush
  # exchange or market state override this with an explicit 60-second grace.
  stop_grace_period: 20s
  logging: *default-logging

# Explicit operator retirement confirmed 2026-10-07. Retain checkpoint rows
# for audit, but do not let these retired owners pin market-state retention.
# This list only controls checkpoint retention for retired strategy runs.
x-retired-strategy-run-ids: &retired-strategy-run-ids >-
  paper-account-16-orderflow-b8-gainer10-v1,
  paper-account-17-orderflow-b1-gainer10-v1,
  paper-account-13-orderflow-b8-long-candle15m-v1,
  paper-account-10-orderflow-b2-long-candle15m-v1,
  paper-account-05-orderflow-candle15m-v1,
  paper-account-12-orderflow-b1-long-candle15m-v1,
  paper-account-14-orderflow-b1-gainer100-v1,
  paper-account-15-orderflow-b1-gainer100-ema-v1,
  paper-account-17-orderflow-b1-gainer10-imbalance040-v1,
  paper-account-16-orderflow-b8-gainer10-imbalance040-v1
services:
  postgres:
    image: postgres:16-alpine
    # Keep observability always-on and bound maintenance concurrency.  The
    # latter prevents a retention/index plan from multiplying work_mem across
    # parallel workers inside the 1 GiB cgroup.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=32MB
      # The 4 MiB default made reporting and retention queries spill to disk:
      # pg_stat_statements showed ~7.9 GB of temp files, whose IO contended
      # with the live telemetry writes inside the persist budget.
      - -c
      - work_mem=16MB
    logging: *default-logging
    environment:
      POSTGRES_DB: cml
      POSTGRES_USER: cml
      POSTGRES_PASSWORD: ${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cml -d cml"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    # PostgreSQL is the live control-plane store.  Retention and recovery can
    # briefly use more memory than the steady-state working set.  Keep a
    # bounded 512 MiB swap allowance so the database does not take all host
    # memory while avoiding cgroup OOM during maintenance.
    # 1280m: peak sat on the 1g ceiling (100%); a database's page cache
    # shares this limit, so the headroom is what it caches instead of
    # rereading from disk.
    mem_limit: 1280m
    memswap_limit: 1536m
    # PostgreSQL maintenance can use dynamic shared memory for parallel
    # vacuum/index work.  The Docker default is only 64 MiB and previously
    # caused VACUUM (ANALYZE) to fail with ENOSPC despite free disk space.
    shm_size: 256m

  migrate:
    <<: *app
    build:
      context: .
      args:
        CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap-universe:
    <<: *app
    entrypoint: ["cml-market-data"]
    command: ["refresh-universe", "--config", "configs/environments/server_paper.yaml"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  volume-init:
    <<: *app
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - chown -R cml:cml /app/data /app/research-data /run/cml/binance-rest-pacer
    volumes:
      - market-data:/app/data
      - research-data:/app/research-data
      - binance-rest-pacer:/run/cml/binance-rest-pacer
    restart: "no"

  market-data:
    <<: *app
    environment:
      <<: *app-environment
      CML_ENVIRONMENT_CONFIG: configs/environments/server_paper.yaml
      CML_RETIRED_STRATEGY_RUN_IDS: *retired-strategy-run-ids
      # Explicit labels supplement accounts discovered from ready open-position
      # reconciliations, including accounts whose services are stopped.
      CML_LIVE_POSITION_ACCOUNT_LABELS: ${CML_LIVE_POSITION_ACCOUNT_LABELS:-}
      CML_MARKET_STATE_HUB_HOST: 0.0.0.0
      CML_MARKET_STATE_HUB_PORT: "8766"
      CML_REALTIME_CLOSURE_DELAY_SECONDS: ${CML_REALTIME_CLOSURE_DELAY_SECONDS:-0.4}
    entrypoint: ["cml-market-data"]
    command: ["run-market-data"]
    depends_on:
      bootstrap-universe:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    volumes:
      - market-data:/app/data
    healthcheck:
      # Runtime-state persistence refreshes the local marker. The probe only
      # reads that marker and never opens a second database connection.
      test: ["CMD", "/usr/local/bin/cml-local-healthcheck", "120"]
      interval: 60s
      start_interval: 5s
      timeout: 15s
      retries: 2
      start_period: 15m
    stop_grace_period: 60s
    # Prefer latency-sensitive ingestion when cold-data maintenance uses CPU.
    cpu_shares: 2048
    mem_limit: 640m

  research-collector:
    <<: *app
    entrypoint: ["cml-research-collector"]
    command:
      - run
      - --hub-url
      - ${CML_MARKET_STATE_HUB_URL:-ws://market-data:8766}
      - --environment
      - research
      - --root
      - /app/research-data
      - --position-environment
      - live
      - --top-count
      - "30"
      - --soft-limit-gib
      - "6"
      - --hard-limit-gib
      - "8"
      - --global-warning-free-gib
      - "15"
      - --global-pause-free-gib
      - "10"
    depends_on:
      market-data:
        condition: service_healthy
    volumes:
      - research-data:/app/research-data
    healthcheck:
      test:
        - CMD
        - python
        - -S
        - /app/src/crypto_momentum_lab/research_collector/health.py
        - --root
        - /app/research-data
        - --environment
        - research
        - --max-age-seconds
        - "120"
      interval: 90s
      start_interval: 5s
      timeout: 15s
      retries: 2
      start_period: 2m
    mem_limit: 256m

  dashboard:
    <<: *app
    # Keep dashboard-only copy changes from forcing a live approval/code hash
    # rotation. The default remains the single release image.
    image: ${CML_DASHBOARD_IMAGE:-crypto-momentum-lab-app:${CML_CODE_COMMIT:?set CML_CODE_COMMIT}}
    environment:
      <<: *app-environment
      CML_MARKET_REVISION_ARCHIVE_DIR: /app/market-revision-archive
    entrypoint: ["cml-operator-dashboard"]
    command: ["--host", "0.0.0.0", "--port", "8765"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - research-data:/app/research-data:ro
      - /var/lib/crypto-momentum-lab/table-archive/market_revision_refs:/app/market-revision-archive:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -S -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 4
      start_period: 30s
    # The dashboard process regularly uses over 200 MiB with all sections
    # loaded, so keep headroom without reserving an account-worker budget.
    # 192m: peak measured at 109 MiB.
    mem_limit: 192m
    memswap_limit: 512m

  decision-evidence-maintenance:
    <<: *app
    # Housekeeping fixes can be released without restarting trading accounts.
    image: ${CML_MAINTENANCE_IMAGE:-crypto-momentum-lab-app:${CML_CODE_COMMIT:?set CML_CODE_COMMIT}}
    profiles: ["maintenance"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 384m
    entrypoint: ["python", "/app/maintenance/share_decision_policy_evidence.py"]
    volumes:
      - ./src/crypto_momentum_lab/tools/share_decision_policy_evidence.py:/app/maintenance/share_decision_policy_evidence.py:ro
    command: ["--collect", "--batch-size", "500", "--max-batches", "20"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  market-revision-metadata-archiver:
    <<: *app
    profiles: ["maintenance"]
    user: "0:0"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 384m
    memswap_limit: 512m
    entrypoint: ["python", "-m", "crypto_momentum_lab.tools.archive_market_revision_metadata"]
    environment:
      <<: *app-environment
      CML_MARKET_REVISION_ARCHIVE_DIR: /app/market-revision-archive
    volumes:
      - /var/lib/crypto-momentum-lab/table-archive/market_revision_refs:/app/market-revision-archive
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  market-revision-archiver:
    <<: *app
    profiles: ["maintenance"]
    user: "0:0"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 768m
    entrypoint: ["cml-archive-market-revisions"]
    environment:
      <<: *app-environment
      CML_MARKET_REVISION_ARCHIVE_DIR: /app/market-revision-archive
    volumes:
      - /var/lib/crypto-momentum-lab/table-archive/market_revision_refs:/app/market-revision-archive
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  market-data:
  research-data:
  binance-rest-pacer:
