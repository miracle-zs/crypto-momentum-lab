name: crypto-momentum-lab

# Optional overlay for the three additional live accounts.  The base
# compose.server.yaml keeps primary unchanged; this file adds account-2/3/4
# while all four strategies consume the same market-data hubs.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-live-account-app: &live-account-app
  image: crypto-momentum-lab-app:${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  environment: &live-account-environment
    CML_DATABASE_URL: postgresql+asyncpg://cml:${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}@postgres:5432/cml
    CML_EXECUTION_DATABASE_URL: ${CML_EXECUTION_DATABASE_URL:-}
    CML_MARKET_DATABASE_URL: ${CML_MARKET_DATABASE_URL:-}
    CML_OBSERVABILITY_DATABASE_URL: ${CML_OBSERVABILITY_DATABASE_URL:-}
    CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  restart: unless-stopped
  stop_grace_period: 60s
  logging: *default-logging

x-live-account-depends: &live-account-depends
  migrate:
    condition: service_completed_successfully

services:
  execution-account-live-account-2:
    <<: *live-account-app
    profiles: ["live"]
    environment:
      <<: *live-account-environment
      BINANCE_READ_API_KEY: ${BINANCE_READ_API_KEY_ACCOUNT_2:?set BINANCE_READ_API_KEY_ACCOUNT_2}
      BINANCE_READ_API_SECRET: ${BINANCE_READ_API_SECRET_ACCOUNT_2:?set BINANCE_READ_API_SECRET_ACCOUNT_2}
      CML_ACCOUNT_EVENT_HUB_HOST: 0.0.0.0
      CML_ACCOUNT_EVENT_HUB_PORT: "8767"
    entrypoint: ["cml-execution-account"]
    command:
      - sync
      - --environment
      - live
      - --hedge-mode
      - --interval-seconds
      - "15"
      - --fill-interval-seconds
      - "300"
      - --rest-reconciliation-interval-seconds
      - "300"
      - --snapshot-retention-days
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_DAYS:-7}
      - --equity-retention-days
      - ${CML_ACCOUNT_EQUITY_RETENTION_DAYS:-370}
      - --snapshot-retention-interval-seconds
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_INTERVAL_SECONDS:-3600}
      - --snapshot-retention-batch-size
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_BATCH_SIZE:-250}
      - --snapshot-retention-max-rows-per-table
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_MAX_ROWS_PER_TABLE:-5000}
      - --snapshot-retention-max-runtime-seconds
      - ${CML_ACCOUNT_SNAPSHOT_RETENTION_MAX_RUNTIME_SECONDS:-45}
      - --account-event-hub-host
      - 0.0.0.0
      - --account-event-hub-port
      - "8767"
      - --account-label
      - account-2
    depends_on: *live-account-depends
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - crypto_momentum_lab.apps.healthcheck_fast
        - --service
        - execution-account
        - --ignore-age
        - --account-label
        - account-2
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    mem_limit: 160m
    memswap_limit: 320m

  execution-account-live-account-3:
    <<: *live-account-app
