name: crypto-momentum-lab

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

x-nextgen-account-depends: &nextgen-account-depends
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  market-data:
    condition: service_healthy

x-nextgen-account-app: &nextgen-account-app
  mem_limit: 192m
  memswap_limit: 384m
  image: crypto-momentum-lab-app:${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
  environment: &nextgen-account-environment
    CML_DATABASE_URL: postgresql+asyncpg://cml:${CML_POSTGRES_PASSWORD:?set CML_POSTGRES_PASSWORD}@postgres:5432/cml
    CML_EXECUTION_DATABASE_URL: ${CML_EXECUTION_DATABASE_URL:-}
    CML_MARKET_QUOTE_VOLUME_HUB_URL: ${CML_MARKET_QUOTE_VOLUME_HUB_URL:-ws://market-data:8768}
    CML_MARKET_STATE_HUB_URL: ${CML_MARKET_STATE_HUB_URL:-ws://market-data:8766}
    CML_MARKET_STATE_ENVIRONMENT: ${CML_MARKET_STATE_ENVIRONMENT:-research}
    CML_LOCAL_HEALTH_DIR: /run/cml/health
    CML_CODE_COMMIT: ${CML_CODE_COMMIT:?set CML_CODE_COMMIT}
    CML_LIVE_CANDLE_GRACE_BARS: ${CML_LIVE_CANDLE_GRACE_BARS:-8}
    CML_LIVE_CANDLE_GRACE_BARS_ACCOUNT_2: ${CML_LIVE_CANDLE_GRACE_BARS_ACCOUNT_2:-${CML_LIVE_CANDLE_GRACE_BARS:-8}}
    CML_LIVE_CANDLE_GRACE_BARS_ACCOUNT_3: ${CML_LIVE_CANDLE_GRACE_BARS_ACCOUNT_3:-${CML_LIVE_CANDLE_GRACE_BARS:-8}}
    CML_LIVE_CANDLE_GRACE_BARS_ACCOUNT_4: ${CML_LIVE_CANDLE_GRACE_BARS_ACCOUNT_4:-${CML_LIVE_CANDLE_GRACE_BARS:-8}}
    CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT: ${CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT:-0.001}
    CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT_ACCOUNT_2: ${CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT_ACCOUNT_2:-${CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT:-0.001}}
    CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT_ACCOUNT_3: ${CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT_ACCOUNT_3:-${CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT:-0.001}}
    CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT_ACCOUNT_4: ${CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT_ACCOUNT_4:-${CML_LIVE_CANDLE_GRACE_DECISION_PROFIT_PCT:-0.001}}
    CML_LIVE_CANDLE_GRACE_PROFIT_PCT: ${CML_LIVE_CANDLE_GRACE_PROFIT_PCT:-0.0088}
    CML_LIVE_CANDLE_GRACE_PROFIT_PCT_ACCOUNT_2: ${CML_LIVE_CANDLE_GRACE_PROFIT_PCT_ACCOUNT_2:-${CML_LIVE_CANDLE_GRACE_PROFIT_PCT:-0.0088}}
    CML_LIVE_CANDLE_GRACE_PROFIT_PCT_ACCOUNT_3: ${CML_LIVE_CANDLE_GRACE_PROFIT_PCT_ACCOUNT_3:-${CML_LIVE_CANDLE_GRACE_PROFIT_PCT:-0.0088}}
    CML_LIVE_CANDLE_GRACE_PROFIT_PCT_ACCOUNT_4: ${CML_LIVE_CANDLE_GRACE_PROFIT_PCT_ACCOUNT_4:-${CML_LIVE_CANDLE_GRACE_PROFIT_PCT:-0.0088}}
    CML_LIVE_CONFIRMATION_BUCKETS: ${CML_LIVE_CONFIRMATION_BUCKETS:-1}
    CML_LIVE_CONFIRMATION_BUCKETS_ACCOUNT_2: ${CML_LIVE_CONFIRMATION_BUCKETS_ACCOUNT_2:-1}
    CML_LIVE_CONFIRMATION_BUCKETS_ACCOUNT_3: ${CML_LIVE_CONFIRMATION_BUCKETS_ACCOUNT_3:-1}
    CML_LIVE_CONFIRMATION_BUCKETS_ACCOUNT_4: ${CML_LIVE_CONFIRMATION_BUCKETS_ACCOUNT_4:-1}
    CML_LIVE_COOLDOWN_BUCKETS: ${CML_LIVE_COOLDOWN_BUCKETS:-0}
    CML_LIVE_COOLDOWN_BUCKETS_ACCOUNT_2: ${CML_LIVE_COOLDOWN_BUCKETS_ACCOUNT_2:-0}
    CML_LIVE_COOLDOWN_BUCKETS_ACCOUNT_3: ${CML_LIVE_COOLDOWN_BUCKETS_ACCOUNT_3:-0}
    CML_LIVE_COOLDOWN_BUCKETS_ACCOUNT_4: ${CML_LIVE_COOLDOWN_BUCKETS_ACCOUNT_4:-0}
    CML_LIVE_ENTRY_LEVERAGE: ${CML_LIVE_ENTRY_LEVERAGE:-5}
    CML_LIVE_ENTRY_LEVERAGE_ACCOUNT_2: ${CML_LIVE_ENTRY_LEVERAGE_ACCOUNT_2:-5}
    CML_LIVE_ENTRY_LEVERAGE_ACCOUNT_3: ${CML_LIVE_ENTRY_LEVERAGE_ACCOUNT_3:-5}
    CML_LIVE_ENTRY_LEVERAGE_ACCOUNT_4: ${CML_LIVE_ENTRY_LEVERAGE_ACCOUNT_4:-5}
    CML_LIVE_ENTRY_POLICY_MODE: ${CML_LIVE_ENTRY_POLICY_MODE:-enforce}
    CML_LIVE_ENTRY_POLICY_MODE_ACCOUNT_2: ${CML_LIVE_ENTRY_POLICY_MODE_ACCOUNT_2:-enforce}
    CML_LIVE_ENTRY_POLICY_MODE_ACCOUNT_3: ${CML_LIVE_ENTRY_POLICY_MODE_ACCOUNT_3:-enforce}
    CML_LIVE_ENTRY_POLICY_MODE_ACCOUNT_4: ${CML_LIVE_ENTRY_POLICY_MODE_ACCOUNT_4:-enforce}
    CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT: ${CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT:-30}
    CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT_ACCOUNT_2: ${CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT_ACCOUNT_2:-30}
    CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT_ACCOUNT_3: ${CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT_ACCOUNT_3:-30}
    CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT_ACCOUNT_4: ${CML_LIVE_ENTRY_POSITIVE_GAINER_TOP_COUNT_ACCOUNT_4:-30}
    CML_LIVE_EXIT_MODE: ${CML_LIVE_EXIT_MODE:-candle_15m}
    CML_LIVE_EXIT_MODE_ACCOUNT_2: ${CML_LIVE_EXIT_MODE_ACCOUNT_2:-candle_15m}
    CML_LIVE_EXIT_MODE_ACCOUNT_3: ${CML_LIVE_EXIT_MODE_ACCOUNT_3:-candle_15m}
    CML_LIVE_EXIT_MODE_ACCOUNT_4: ${CML_LIVE_EXIT_MODE_ACCOUNT_4:-candle_15m}
    CML_LIVE_IMPULSE_WINDOW_BUCKETS: ${CML_LIVE_IMPULSE_WINDOW_BUCKETS:-2}
    CML_LIVE_IMPULSE_WINDOW_BUCKETS_ACCOUNT_2: ${CML_LIVE_IMPULSE_WINDOW_BUCKETS_ACCOUNT_2:-2}
    CML_LIVE_IMPULSE_WINDOW_BUCKETS_ACCOUNT_3: ${CML_LIVE_IMPULSE_WINDOW_BUCKETS_ACCOUNT_3:-2}
    CML_LIVE_IMPULSE_WINDOW_BUCKETS_ACCOUNT_4: ${CML_LIVE_IMPULSE_WINDOW_BUCKETS_ACCOUNT_4:-2}
    CML_LIVE_MARGIN_TYPE: ${CML_LIVE_MARGIN_TYPE:-CROSSED}
    CML_LIVE_MARGIN_TYPE_ACCOUNT_2: ${CML_LIVE_MARGIN_TYPE_ACCOUNT_2:-CROSSED}
    CML_LIVE_MARGIN_TYPE_ACCOUNT_3: ${CML_LIVE_MARGIN_TYPE_ACCOUNT_3:-CROSSED}
    CML_LIVE_MARGIN_TYPE_ACCOUNT_4: ${CML_LIVE_MARGIN_TYPE_ACCOUNT_4:-CROSSED}
    CML_LIVE_MAX_CONCURRENCY_PER_SYMBOL: ${CML_LIVE_MAX_CONCURRENCY_PER_SYMBOL:-2}
    CML_LIVE_MAX_CONCURRENCY_PER_SYMBOL_ACCOUNT_2: ${CML_LIVE_MAX_CONCURRENCY_PER_SYMBOL_ACCOUNT_2:-2}
    CML_LIVE_MAX_CONCURRENCY_PER_SYMBOL_ACCOUNT_3: ${CML_LIVE_MAX_CONCURRENCY_PER_SYMBOL_ACCOUNT_3:-2}
    CML_LIVE_MAX_CONCURRENCY_PER_SYMBOL_ACCOUNT_4: ${CML_LIVE_MAX_CONCURRENCY_PER_SYMBOL_ACCOUNT_4:-2}
    CML_LIVE_MIN_IMBALANCE: ${CML_LIVE_MIN_IMBALANCE:-0.30}
    CML_LIVE_MIN_IMBALANCE_ACCOUNT_2: ${CML_LIVE_MIN_IMBALANCE_ACCOUNT_2:-0.30}
    CML_LIVE_MIN_IMBALANCE_ACCOUNT_3: ${CML_LIVE_MIN_IMBALANCE_ACCOUNT_3:-0.30}
    CML_LIVE_MIN_IMBALANCE_ACCOUNT_4: ${CML_LIVE_MIN_IMBALANCE_ACCOUNT_4:-0.30}
    CML_LIVE_MIN_INTENSITY: ${CML_LIVE_MIN_INTENSITY:-3.0}
    CML_LIVE_MIN_INTENSITY_ACCOUNT_2: ${CML_LIVE_MIN_INTENSITY_ACCOUNT_2:-3.0}
    CML_LIVE_MIN_INTENSITY_ACCOUNT_3: ${CML_LIVE_MIN_INTENSITY_ACCOUNT_3:-3.0}
    CML_LIVE_MIN_INTENSITY_ACCOUNT_4: ${CML_LIVE_MIN_INTENSITY_ACCOUNT_4:-3.0}
    CML_LIVE_MIN_NOTIONAL_5M_VS_30M: ${CML_LIVE_MIN_NOTIONAL_5M_VS_30M:-1.25}
    CML_LIVE_MIN_NOTIONAL_5M_VS_30M_ACCOUNT_2: ${CML_LIVE_MIN_NOTIONAL_5M_VS_30M_ACCOUNT_2:-1.25}
    CML_LIVE_MIN_NOTIONAL_5M_VS_30M_ACCOUNT_3: ${CML_LIVE_MIN_NOTIONAL_5M_VS_30M_ACCOUNT_3:-1.25}
    CML_LIVE_MIN_NOTIONAL_5M_VS_30M_ACCOUNT_4: ${CML_LIVE_MIN_NOTIONAL_5M_VS_30M_ACCOUNT_4:-1.25}
    CML_LIVE_MIN_RETURN_PCT: ${CML_LIVE_MIN_RETURN_PCT:-0.0075}
    CML_LIVE_MIN_RETURN_PCT_ACCOUNT_2: ${CML_LIVE_MIN_RETURN_PCT_ACCOUNT_2:-0.0075}
    CML_LIVE_MIN_RETURN_PCT_ACCOUNT_3: ${CML_LIVE_MIN_RETURN_PCT_ACCOUNT_3:-0.0075}
    CML_LIVE_MIN_RETURN_PCT_ACCOUNT_4: ${CML_LIVE_MIN_RETURN_PCT_ACCOUNT_4:-0.0075}
    CML_LIVE_SESSION_ID: ${CML_LIVE_SESSION_ID:-live-primary-v1}
    CML_LIVE_SESSION_ID_ACCOUNT_2: ${CML_LIVE_SESSION_ID_ACCOUNT_2:-live-account-2-v1}
    CML_LIVE_SESSION_ID_ACCOUNT_3: ${CML_LIVE_SESSION_ID_ACCOUNT_3:-live-account-3-v1}
    CML_LIVE_SESSION_ID_ACCOUNT_4: ${CML_LIVE_SESSION_ID_ACCOUNT_4:-live-account-4-v1}
    CML_LIVE_STRATEGY: ${CML_LIVE_STRATEGY:-orderflow_impulse}
    CML_LIVE_STRATEGY_ACCOUNT_2: ${CML_LIVE_STRATEGY_ACCOUNT_2:-orderflow_impulse}
    CML_LIVE_STRATEGY_ACCOUNT_3: ${CML_LIVE_STRATEGY_ACCOUNT_3:-orderflow_impulse}
    CML_LIVE_STRATEGY_ACCOUNT_4: ${CML_LIVE_STRATEGY_ACCOUNT_4:-orderflow_impulse}
    CML_LIVE_STRATEGY_CONFIG_HASH: ${CML_LIVE_STRATEGY_CONFIG_HASH:-unset}
    CML_LIVE_STRATEGY_CONFIG_HASH_ACCOUNT_2: ${CML_LIVE_STRATEGY_CONFIG_HASH_ACCOUNT_2:-unset}
    CML_LIVE_STRATEGY_CONFIG_HASH_ACCOUNT_3: ${CML_LIVE_STRATEGY_CONFIG_HASH_ACCOUNT_3:-unset}
    CML_LIVE_STRATEGY_CONFIG_HASH_ACCOUNT_4: ${CML_LIVE_STRATEGY_CONFIG_HASH_ACCOUNT_4:-unset}
    CML_LIVE_TARGET_NOTIONAL: ${CML_LIVE_TARGET_NOTIONAL:-100.00}
    CML_LIVE_TARGET_NOTIONAL_ACCOUNT_2: ${CML_LIVE_TARGET_NOTIONAL_ACCOUNT_2:-${CML_LIVE_TARGET_NOTIONAL:-100.00}}
    CML_LIVE_TARGET_NOTIONAL_ACCOUNT_3: ${CML_LIVE_TARGET_NOTIONAL_ACCOUNT_3:-${CML_LIVE_TARGET_NOTIONAL:-100.00}}
    CML_LIVE_TARGET_NOTIONAL_ACCOUNT_4: ${CML_LIVE_TARGET_NOTIONAL_ACCOUNT_4:-${CML_LIVE_TARGET_NOTIONAL:-100.00}}
  entrypoint: ["cml-next-gen"]
  restart: unless-stopped
  stop_grace_period: 90s
  logging: *default-logging
  depends_on: *nextgen-account-depends
  healthcheck:
    test: ["CMD", "/usr/local/bin/cml-local-healthcheck", "180"]
    interval: 30s
    start_interval: 5s
    timeout: 10s
    retries: 3
    start_period: 10m

services:
  dashboard:
    environment:
      <<: *nextgen-account-environment

  nextgen-strategy-primary:
    <<: *nextgen-account-app
    profiles: ["nextgen"]
    container_name: cml-nextgen-strategy-primary
    environment:
      <<: *nextgen-account-environment
      CML_ACCOUNT_LABEL: primary
      BINANCE_READ_API_KEY: ${BINANCE_READ_API_KEY:?set BINANCE_READ_API_KEY}
      BINANCE_READ_API_SECRET: ${BINANCE_READ_API_SECRET:?set BINANCE_READ_API_SECRET}
      BINANCE_TRADE_API_KEY: ${BINANCE_TRADE_API_KEY_PRIMARY:-${BINANCE_TRADE_API_KEY:?set BINANCE_TRADE_API_KEY}}
      BINANCE_TRADE_API_SECRET: ${BINANCE_TRADE_API_SECRET_PRIMARY:-${BINANCE_TRADE_API_SECRET:?set BINANCE_TRADE_API_SECRET}}
    command:
      - run
      - --environment
      - live
      - --account-label
      - primary
      - --keepalive-interval
      - "1800"

  nextgen-strategy-account-2:
    <<: *nextgen-account-app
    profiles: ["nextgen"]
    container_name: cml-nextgen-strategy-account-2
    environment:
      <<: *nextgen-account-environment
      CML_ACCOUNT_LABEL: account-2
      BINANCE_READ_API_KEY: ${BINANCE_READ_API_KEY_ACCOUNT_2:?set BINANCE_READ_API_KEY_ACCOUNT_2}
      BINANCE_READ_API_SECRET: ${BINANCE_READ_API_SECRET_ACCOUNT_2:?set BINANCE_READ_API_SECRET_ACCOUNT_2}
      BINANCE_TRADE_API_KEY: ${BINANCE_TRADE_API_KEY_ACCOUNT_2:?set BINANCE_TRADE_API_KEY_ACCOUNT_2}
      BINANCE_TRADE_API_SECRET: ${BINANCE_TRADE_API_SECRET_ACCOUNT_2:?set BINANCE_TRADE_API_SECRET_ACCOUNT_2}
    command:
      - run
      - --environment
      - live
      - --account-label
      - account-2
      - --keepalive-interval
      - "1800"

  nextgen-strategy-account-3:
    <<: *nextgen-account-app
    profiles: ["nextgen"]
    container_name: cml-nextgen-strategy-account-3
    environment:
      <<: *nextgen-account-environment
      CML_ACCOUNT_LABEL: account-3
      BINANCE_READ_API_KEY: ${BINANCE_READ_API_KEY_ACCOUNT_3:?set BINANCE_READ_API_KEY_ACCOUNT_3}
      BINANCE_READ_API_SECRET: ${BINANCE_READ_API_SECRET_ACCOUNT_3:?set BINANCE_READ_API_SECRET_ACCOUNT_3}
      BINANCE_TRADE_API_KEY: ${BINANCE_TRADE_API_KEY_ACCOUNT_3:?set BINANCE_TRADE_API_KEY_ACCOUNT_3}
      BINANCE_TRADE_API_SECRET: ${BINANCE_TRADE_API_SECRET_ACCOUNT_3:?set BINANCE_TRADE_API_SECRET_ACCOUNT_3}
    command:
      - run
      - --environment
      - live
      - --account-label
      - account-3
      - --keepalive-interval
      - "1800"

  nextgen-strategy-account-4:
    <<: *nextgen-account-app
    profiles: ["nextgen"]
    container_name: cml-nextgen-strategy-account-4
    environment:
      <<: *nextgen-account-environment
      CML_ACCOUNT_LABEL: account-4
      BINANCE_READ_API_KEY: ${BINANCE_READ_API_KEY_ACCOUNT_4:?set BINANCE_READ_API_KEY_ACCOUNT_4}
      BINANCE_READ_API_SECRET: ${BINANCE_READ_API_SECRET_ACCOUNT_4:?set BINANCE_READ_API_SECRET_ACCOUNT_4}
      BINANCE_TRADE_API_KEY: ${BINANCE_TRADE_API_KEY_ACCOUNT_4:?set BINANCE_TRADE_API_KEY_ACCOUNT_4}
      BINANCE_TRADE_API_SECRET: ${BINANCE_TRADE_API_SECRET_ACCOUNT_4:?set BINANCE_TRADE_API_SECRET_ACCOUNT_4}
    command:
      - run
      - --environment
      - live
      - --account-label
      - account-4
      - --keepalive-interval
      - "1800"
